name: Check site

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/**"
      - "test/**"
      - ".github/workflows/check-site.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check site
        run: node scripts/check-site.mjs
      - name: Tests
        run: node --test test/check-site.test.mjs
